# content.yaml

about: >
  CODE: Магнетизм — закрытое пространство движения: подкасты, практики, челленджи.
  Красная нить 5 недель: внимание → мысли → слова → эмоции → реакции.
  Внутри — структура и результат.

rules: |
  Правила клуба:
  1. Уважение и конфиденциальность — то, что обсуждается внутри, остаётся внутри.
  2. Активное участие в практиках и челленджах.
  3. Поддержка других участниц (участников) без критики.
  4. Вопросы — через поддержку или в обсуждениях клуба.

faq: |
  ❓ Частые вопросы

  Q: Как попасть в клуб?
  A: Сейчас доступ бесплатный. После активации ты получаешь ссылку на приватный канал.

  Q: С чего начать?
  A: Начни с привет-поста: {{WELCOME_POST_URL}}

  Q: Где задать вопрос?
  A: Пиши напрямую в поддержку: {{SUPPORT_CONTACT}}

onboarding:
  - "Добро пожаловать в CODE: Магнетизм! ✨\nНачни с привет-поста: {{WELCOME_POST_URL}}"
  - "Шаг 2. Ознакомься с правилами клуба."
  - "Шаг 3. Отметься в дневнике недели."
  - "Шаг 4. Выбери первый челлендж и начни практиковать."
  - "Мы рядом — задавай вопросы через поддержку."

funnel:
  lesson_urls:
    1: ""  # вставишь ссылку на урок 1 (например, Antitraining)
    2: ""
    3: ""
    4: ""
  hw_questions:
    1: "Что сегодня забрало твоё внимание?"
    2: "Какая мысль у тебя чаще всего повторяется?"
    3: "Какую фразу ты готова заменить на более точную?"
    4: "Какое действие в эмоциях ты готова изменить сегодня?"

offer_after_lesson_4: >
  Ты прошла 4 шага 🙌
  Готова зайти глубже? В клубе ждут система и поддержка изнутри.
  Оформить доступ: {{CHECKOUT_URL}}

weekly_materials: |
  📚 Материалы недели:
  • Подкаст: [ссылка]
  • Практика: [ссылка]
  • Челлендж: [описание]
  • Дневник: [шаблон]

schedule: |
  🗓️ Расписание клуба.
  Ниже мы собираем текущую неделю цикла и ближайшие события.
  Чтобы получить напоминание за час до начала, отправь команду /remind_<ID> из списка ниже.

forms:
  reminder_template: |
    Напоминание: анкета «{form_label}» ждёт завершения.
    Если уже отправила форму, просто игнорируй это сообщение.

menu:
  start: |
    Добро пожаловать в CODE: Магнетизм, {name}!

    Выбери раздел в меню, чтобы продолжить.
  registration_complete: |
    Регистрация завершена, {name}!

    Теперь тебе доступно:
    - Бесплатные уроки
    - Доступ в клуб
    - Отслеживание прогресса

    Выбирай в меню и начинай.
  prompts:
    root: |
      Главное меню.

      Разделы: «О клубе», «Обучение», «Материалы» и «Профиль». Выбери, что интересно прямо сейчас.
    info: |
      Раздел «О клубе».

      Здесь можно узнать о проекте, правилах и частых вопросах.
    learning: |
      Раздел «Обучение».

      Здесь собраны бесплатные уроки, «Мой прогресс», тест и запись на разбор.
    materials: |
      Раздел «Материалы».

      Здесь — материалы недели, каталог клуба с подкастами, практиками, челленджами и архивом, а также расписание эфиров.
    profile: |
      Раздел «Профиль».

      Проверь контакты, статус доступа и обнови email или телефон.
  analysis:
    intro: |
      Персональный разбор.

      Ответь на несколько вопросов, чтобы оставить заявку.
    format_prompt: |
      Какой формат встречи тебе удобен? Например: Zoom, очно или другой вариант.
    format_retry: |
      Напиши, какой формат разбора тебе подходит. Можно указать несколько вариантов.
    contact_prompt: |
      Оставь контакт для связи: телефон, @username или другой удобный способ.
    contact_retry: |
      Нужен контакт, чтобы мы связались. Напиши телефон, @username или ссылку.
    time_prompt: |
      Когда тебе удобно провести разбор? Укажи несколько вариантов даты и времени.
    time_retry: |
      Напиши, когда тебе комфортно провести разбор. Можно предложить несколько слотов.
    confirm_prompt: |
      Проверь заявку:
      • Формат: {format}
      • Контакт: {contact}
      • Время: {time}

      Если всё верно — нажми «{confirm_button}».
    success: |
      Заявка сохранена. Команда свяжется с тобой, чтобы согласовать детали.
  test: |
    Тест «Уровень вовлечённости».

    Ответь на вопросы, чтобы получить персональный разбор и узнать свой следующий шаг.
  test_intro: |
    Тест «Уровень вовлечённости».

    Ответь на вопросы, чтобы получить персональный разбор и узнать свой следующий шаг.
  test_birthdate_prompt: |
    Чтобы записать тебя на тест, напиши дату рождения.
    Подойдут варианты: 24.08.1992 или 24 августа 1992.

    Для отмены нажми «Отмена».
  test_birthdate_invalid: |
    Не получилось распознать дату. Попробуй формат 24.08.1992 или 24 августа 1992.

    Если передумала — нажми «Отмена».
  test_name_prompt: |
    Отлично! Как тебя записать в заявке?

    Можно указать короткое имя или ник.
  test_name_invalid: Имя должно содержать хотя бы два символа. Попробуй снова.
  test_thanks: |
    Спасибо, {name}! Мы записали тебя на тестирование.
    Когда будет готов анализ, администратор напишет в Telegram.
  weekly:
    locked: |
      Материалы недели доступны участницам (участникам) клуба.

      Оформи доступ в разделе «💳 Оплаты», и бот пришлёт ссылки автоматически.
    disabled: |
      Раздел «Материалы недели» временно закрыт. Мы сообщим, когда материалы появятся снова.
  schedule:
    locked: |
      Расписание доступно участницам (участникам) клуба.

      Активируй доступ — и бот пришлёт ближайшие эфиры.
    disabled: |
      Расписание временно недоступно. Мы обновляем график и отправим уведомление, как только всё будет готово.
  pay:
    closed: |
      Оплата временно закрыта. Мы сообщим о новом окне, как только оно откроется.
  support: |
    Поддержка.

    Если есть вопросы или сложности — напиши: {support}.
    Мы отвечаем лично и максимально быстро.

    Каналы связи:
    {support_channels_text}

    Выбирай кнопку ниже, чтобы перейти в нужный канал.
  learning:
    progress: |
      Здесь отображаются твои шаги в бесплатной программе.

      Следи за статусом уроков и продолжай с того, что доступно прямо сейчас.
  materials:
    catalog: |
      Каталог материалов клуба.

      Выбирай нужный раздел: подкасты, практики, челленджи или архив недель. Новые материалы появятся автоматически в соответствующем разделе.
    practices: |
      Практики клуба.

      Возвращайся к упражнениям, чтобы закреплять результаты и отслеживать изменения.
    challenges: |
      Челленджи и тематические марафоны.

      Выбирай формат под задачу и отмечай прогресс в «Материалах недели».
    podcasts: |
      Подкасты клуба.

      Слушай тематические выпуски и отмечай идеи, которые хочется внедрить прямо сейчас.
    podcasts.locked: |
      Подкасты доступны участницам (участникам) клуба. Оформи доступ — и откроются все эпизоды.
    archive: |
      Архив недель.

      Возвращайся к прошедшим материалам, чтобы повторить любимые практики и челленджи.
    archive.locked: |
      Архив недель доступен участницам (участникам) клуба. Продли участие, чтобы открывать прошедшие материалы.
    archive.week1: |
      Архив — Неделя 1.

      • Подкаст недели: [ссылка]
      • Практика недели: [описание]
      • Челлендж недели: [инструкция]
    archive.week1.locked: |
      Материалы первой архивной недели доступны участницам (участникам) клуба. Оформи или продли доступ, чтобы вернуться к этим занятиям.

settings:
  payments_open: "true"
  show_weekly_materials: "true"
  show_schedule: "true"
