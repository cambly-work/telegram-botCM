# content.yaml

about: >
  CODE: Магнетизм — закрытое пространство движения: подкасты, практики, челленджи.
  Красная нить 5 недель: внимание → мысли → слова → эмоции → реакции.
  Внутри — структура и результат.

rules: |
  Правила клуба:
  1. Уважение и конфиденциальность — то, что обсуждается внутри, остаётся внутри.
  2. Активное участие в практиках и челленджах.
  3. Поддержка других участниц без критики.
  4. Вопросы — через поддержку или в обсуждениях клуба.

faq: |
  ❓ Частые вопросы

  Q: Как попасть в клуб?
  A: Сейчас доступ бесплатный. После активации ты получаешь ссылку на приватный канал.

  Q: С чего начать?
  A: Начни с привет-поста: {{WELCOME_POST_URL}}

  Q: Где задать вопрос?
  A: Пиши напрямую в поддержку: {{SUPPORT_CONTACT}}

onboarding:
  - "Добро пожаловать в CODE: Магнетизм! ✨\nНачни с привет-поста: {{WELCOME_POST_URL}}"
  - "Шаг 2. Ознакомься с правилами клуба."
  - "Шаг 3. Отметься в дневнике недели."
  - "Шаг 4. Выбери первый челлендж и начни практиковать."
  - "Мы рядом — задавай вопросы через поддержку."

funnel:
  lesson_urls:
    1: ""  # вставишь ссылку на урок 1 (например, Antitraining)
    2: ""
    3: ""
    4: ""
  hw_questions:
    1: "Что сегодня забрало твоё внимание?"
    2: "Какая мысль у тебя чаще всего повторяется?"
    3: "Какую фразу ты готова заменить на более точную?"
    4: "Какое действие в эмоциях ты готова изменить сегодня?"

offer_after_lesson_4: >
  Ты прошла 4 шага 🙌
  Готова зайти глубже? В клубе ждут система и поддержка изнутри.
  Оформить доступ: {{CHECKOUT_URL}}

weekly_materials: |
  📚 Материалы недели:
  • Подкаст: [ссылка]
  • Практика: [ссылка]
  • Челлендж: [описание]
  • Дневник: [шаблон]

schedule: |
  🗓️ Расписание эфиров:
  • Понедельник 20:00 — Вводный эфир
  • Четверг 19:00 — Практика в группе
  • Воскресенье 18:00 — Подведение итогов

forms:
  reminder_template: |
    Напоминание: анкета «{form_label}» ждёт завершения.
    Если уже отправила форму, просто игнорируй это сообщение.

menu:
  start: |
    Добро пожаловать в CODE: Магнетизм, {name}!

    Выбери раздел в меню, чтобы продолжить.
  registration_complete: |
    Регистрация завершена, {name}!

    Теперь тебе доступно:
    - Бесплатные уроки
    - Доступ в клуб
    - Отслеживание прогресса

    Выбирай в меню и начинай.
  prompts:
    root: |
      Главное меню
      Выбери раздел, чтобы продолжить.
    info: |
      Раздел «О клубе».

      Здесь можно узнать о проекте, правилах и частых вопросах.
    learning: |
      Раздел «Обучение».

      Выбирай уроки, отслеживай прогресс и записывайся на разборы.
    materials: |
      Раздел «Материалы».

      Контент доступен участницам клуба. Если доступ закрыт — оформи подписку.
    profile: |
      Раздел «Профиль».

      Здесь можно проверить контакты и статус доступа.
  test: |
    Тест «Уровень вовлечённости».

    Ответь на вопросы, чтобы получить персональный разбор и узнать свой следующий шаг.
  test_intro: |
    Тест «Уровень вовлечённости».

    Ответь на вопросы, чтобы получить персональный разбор и узнать свой следующий шаг.
  test_birthdate_prompt: |
    Чтобы записать тебя на тест, напиши дату рождения.
    Подойдут варианты: 24.08.1992 или 24 августа 1992.

    Для отмены нажми «Отмена».
  test_birthdate_invalid: |
    Не получилось распознать дату. Попробуй формат 24.08.1992 или 24 августа 1992.

    Если передумала — нажми «Отмена».
  test_name_prompt: |
    Отлично! Как тебя записать в заявке?

    Можно указать короткое имя или ник.
  test_name_invalid: Имя должно содержать хотя бы два символа. Попробуй снова.
  test_thanks: |
    Спасибо, {name}! Мы записали тебя на тестирование.
    Когда будет готов анализ, администратор напишет в Telegram.
  weekly:
    locked: |
      Материалы недели доступны участницам клуба.

      Оформи доступ в разделе «💳 Оплаты», и бот пришлёт ссылки автоматически.
    disabled: |
      Раздел «Материалы недели» временно закрыт. Мы сообщим, когда материалы появятся снова.
  schedule:
    locked: |
      Расписание доступно участницам клуба.

      Активируй доступ — и бот пришлёт ближайшие эфиры.
    disabled: |
      Расписание временно недоступно. Мы обновляем график и отправим уведомление, как только всё будет готово.
  pay:
    closed: |
      Оплата временно закрыта. Мы сообщим о новом окне, как только оно откроется.
  support: |
    Поддержка.

    Если есть вопросы или сложности — напиши: {support}.
    Мы отвечаем лично и максимально быстро.

settings:
  payments_open: "true"
  show_weekly_materials: "true"
  show_schedule: "true"
