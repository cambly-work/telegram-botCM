version: "3.9"

services:
  bot:
    build:
      context: .
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://deb.debian.org/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://security.debian.org/debian-security}
    container_name: code-magnetism-bot
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      ngrok:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: code-magnetism-db
    environment:
      POSTGRES_DB: magnetism
      POSTGRES_USER: magnet
      POSTGRES_PASSWORD: magnet_pwd
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magnet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:alpine
    container_name: code-magnetism-ngrok
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command:
      - http
      - --log=stdout
      - --log-format=json
      - ${NGROK_FORWARD_ADDR:-bot:8000}
    ports:
      - "4040:4040"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4040/api/tunnels >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
