version: "3.9"

services:
  bot:
    build: .
    container_name: code-magnetism-bot
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: code-magnetism-db
    environment:
      POSTGRES_DB: magnetism
      POSTGRES_USER: magnet
      POSTGRES_PASSWORD: magnet_pwd
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magnet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
